# Fly.io — one machine, one volume.
#
# ⚠️  Never scale this app past a single machine. A Fly volume attaches to
#     exactly one machine, so a second instance would come up with its own
#     empty database and serve a different half of your traffic. SQLite is
#     the right trade here because the workload is one writer and many reads,
#     but it does mean `fly scale count 1`, always.
#
#   fly launch --no-deploy --copy-config
#   fly volumes create glassfish_data --size 1 --region fra
#   fly secrets set GLASSFISH_PUBLIC_URL=https://<your-app>.fly.dev
#   fly deploy

app = "glassfish-zero"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  GLASSFISH_DB = "/data/glassfish.db"

[[mounts]]
  source = "glassfish_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  # Suspending is safe for reads, but a suspended machine cannot accept
  # ingest, and the SDK would spend its retries waiting for a cold start.
  # Keep one machine warm.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  # 256mb (the shared-cpu-1x default) is not enough for the Next.js server;
  # swap is a backstop so a traffic spike degrades instead of OOM-killing the
  # machine and dropping the spans in flight.
  size = "shared-cpu-1x"
  memory = "512mb"

swap_size_mb = 512
